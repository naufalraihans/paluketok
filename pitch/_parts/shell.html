<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>PaluKetok · Pitch Deck</title>
<style>
/*__FONTS__*/

/* ==========================================================================
   PaluKetok Pitch Deck
   Palet diambil dari identitas produk (web/src/app.css + design/favicon.svg):
     ink     #0B0F17   kanvas gelap
     paper   #FFFFFF   kanvas terang
     mist    #FAFAFB   kanvas terang kedua
     line    #E2E8F0   hairline
     muted   #64748B   teks sekunder
     brand   #2563EB   aksen tunggal
     deep    #141B2B   panel gelap
   Aturan: tanpa gradasi, tanpa glass, tanpa glow. Kedalaman dari hairline.
   ========================================================================== */

*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#0B0F17;
  --deep:#141B2B;
  --deep2:#1B2334;
  --paper:#FFFFFF;
  --mist:#FAFAFB;
  --mist2:#F4F6F9;
  --line:#E2E8F0;
  --line2:#CBD5E1;
  --line-dark:#2A3346;
  --muted:#556071;
  --muted-dark:#A3ACC0;
  --micro:#5F6A7D;        /* label mono kecil, aman di kanvas terang */
  --micro-soft:#5F6A7D;   /* caption di dalam kartu mist */
  --micro-dark:#9AA4B8;   /* label mono kecil di kanvas gelap */
  --folio:#5F6A7D;
  --brand:#2563EB;
  --brand-dark:#1D4ED8;
  --brand-soft:#EFF6FF;
  --brand-line:#BFDBFE;
  --amber:#B45309;
  --amber-soft:#FEF3C7;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}

html,body{height:100%;overflow:hidden;background:#3A3F4B}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

#stage{
  position:fixed;left:50%;top:50%;
  width:1920px;height:1080px;
  transform-origin:center center;
  background:var(--paper);
  overflow:hidden;
}

.slide{
  position:absolute;inset:0;
  padding:76px 104px 96px;
  display:none;
  background:var(--paper);
}
.slide.on{display:block}

/* ---------- kerangka slide ---------- */
.folio{
  position:absolute;left:104px;right:104px;bottom:38px;
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--folio);
}
.slide.dark .folio{color:var(--micro-dark)}
.slide.dark{background:var(--ink);color:#F1F5F9}

.mark{
  display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--muted);
}
.mark .sq{width:10px;height:10px;background:var(--brand);flex:none}
.slide.dark .mark{color:var(--muted-dark)}

h1{font-size:76px;line-height:1.02;letter-spacing:-.028em;font-weight:800}
h2{font-size:52px;line-height:1.08;letter-spacing:-.024em;font-weight:800}
h3{font-size:26px;line-height:1.25;letter-spacing:-.012em;font-weight:700}
.lead{font-size:23px;line-height:1.5;color:var(--muted);font-weight:500;max-width:1180px}
.slide.dark .lead{color:#B7BFCF}
.brand{color:var(--brand)}
.slide.dark .brand{color:#7BA4F7}

.eyebrow{
  font-family:var(--mono);font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:500;
}
.rule{height:1px;background:var(--line);width:100%}
.slide.dark .rule{background:var(--line-dark)}

.head{display:flex;flex-direction:column;gap:22px;margin-bottom:52px}
.head .rule{margin-top:6px}

/* ---------- kartu ---------- */
.card{
  border:1px solid var(--line);background:var(--paper);
  padding:30px 32px;display:flex;flex-direction:column;gap:12px;
}
.card.mist{background:var(--mist)}
.card.mist .cap{color:var(--micro-soft)}
.card .cap{
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--micro);
}
.card .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.card p{font-size:17px;line-height:1.5;color:var(--muted)}
.slide.dark .card{background:var(--deep);border-color:var(--line-dark)}
.slide.dark .card .cap{color:var(--micro-dark)}
.slide.dark .card p{color:#B7BFCF}

.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}

/* ---------- tabel ---------- */
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
th{
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:#4A5568;font-weight:500;background:var(--mist2);
  border-top:1px solid var(--line);
}
td.num{text-align:right;font-family:var(--mono)}
tr:last-child td{border-bottom:1px solid var(--line)}
.slide.dark th{background:var(--deep2);color:#B7BFCF;border-color:var(--line-dark)}
.slide.dark td{border-color:var(--line-dark)}

.chip{
  display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border:1px solid var(--line);
  color:#4A5568;background:var(--paper);
}
.chip.ok{border-color:var(--brand-line);background:var(--brand-soft);color:var(--brand-dark)}
.chip.warn{border-color:#FDE68A;background:var(--amber-soft);color:var(--amber)}
.slide.dark .chip{background:transparent;border-color:var(--line-dark);color:#B7BFCF}

/* ---------- blok kode / kontrak ---------- */
pre{
  font-family:var(--mono);font-size:15px;line-height:1.62;
  background:var(--mist);border:1px solid var(--line);
  padding:22px 24px;overflow:hidden;color:#33415A;
}
pre b{color:var(--brand-dark);font-weight:600}
pre i{color:var(--micro);font-style:normal}
.slide.dark pre{background:var(--deep);border-color:var(--line-dark);color:#D3DAE6}
.slide.dark pre b{color:#7BA4F7}
.slide.dark pre i{color:var(--micro-dark)}

/* ---------- diagram pipeline ---------- */
.pipe{display:flex;align-items:stretch;gap:0}
.stage{
  flex:1;border:1px solid var(--line);border-left:0;padding:20px 18px;
  display:flex;flex-direction:column;gap:8px;background:var(--paper);
}
.stage:first-child{border-left:1px solid var(--line)}
.stage .no{font-family:var(--mono);font-size:12px;color:var(--micro);letter-spacing:.1em}
.stage .nm{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em}
.stage .ds{font-size:14px;line-height:1.42;color:var(--muted)}
.stage.done{background:var(--brand-soft);border-color:var(--brand-line)}
.stage.done .nm{color:var(--brand-dark)}
.stage.done .no{color:#7BA4F7}

/* ---------- anak tangga arsitektur ---------- */
.layer{
  display:grid;grid-template-columns:210px 1fr;align-items:center;
  border:1px solid var(--line);border-top:0;background:var(--paper);
}
.layer:first-child{border-top:1px solid var(--line)}
.layer .lb{
  font-family:var(--mono);font-size:17px;font-weight:600;padding:18px 22px;
  border-right:1px solid var(--line);background:var(--mist2);
}
.layer .lv{padding:18px 24px;font-size:16px;line-height:1.45;color:var(--muted)}
.layer .lv b{color:var(--ink);font-weight:600}
.layer.core .lb{background:var(--brand-soft);color:var(--brand-dark)}
.layer.edge .lb{background:var(--ink);color:#F1F5F9;border-color:var(--ink)}

/* ---------- ledger ---------- */
.ledger{display:flex;flex-direction:column;gap:0}
.lrow{
  display:grid;grid-template-columns:96px 1fr 150px;gap:18px;align-items:center;
  padding:15px 20px;border:1px solid var(--line);border-top:0;
  font-family:var(--mono);font-size:15px;background:var(--paper);
}
.lrow:first-child{border-top:1px solid var(--line)}
.lrow .d{font-weight:600;text-align:right}
.lrow .d.m{color:var(--amber)}
.lrow .d.p{color:var(--brand-dark)}
.lrow .r{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:right}
.lrow.sum{background:var(--brand-soft);border-color:var(--brand-line)}
.lrow .t{font-family:var(--sans);font-size:16px;color:var(--ink)}

/* ---------- checklist ---------- */
.chk{display:flex;flex-direction:column;gap:0}
.chk .row{
  display:grid;grid-template-columns:26px 1fr;gap:16px;align-items:start;
  padding:15px 0;border-bottom:1px solid var(--line);
}
.chk .row:last-child{border-bottom:0}
.chk .box{
  width:18px;height:18px;border:1px solid var(--line2);margin-top:2px;
  display:flex;align-items:center;justify-content:center;flex:none;
}
.chk .box.on{background:var(--brand);border-color:var(--brand)}
.chk .box.on::after{content:'';width:7px;height:7px;background:#fff}
.chk .tx{font-size:16px;line-height:1.45}
.chk .tx small{display:block;font-family:var(--mono);font-size:12px;color:var(--micro);margin-top:3px}

/* ---------- nomor besar ---------- */
.numbig{font-family:var(--mono);font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--brand)}
.slide.dark .numbig{color:#7BA4F7}

/* ---------- motion ---------- */
.a{opacity:0;animation:rise .5s cubic-bezier(.22,.8,.3,1) both;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.a{animation:none;opacity:1}}

/* ---------- catatan pembicara ---------- */
#notes{
  position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;display:none;
  background:#0B0F17;color:#CBD5E1;border-top:1px solid #2A3346;
  padding:22px 28px;font-size:16px;line-height:1.55;z-index:20;
}
#notes.on{display:block}
#notes .nh{
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:#7BA4F7;margin-bottom:10px;
}
#notes .nt{font-family:var(--mono);font-size:12px;color:#5B6479;margin-top:10px}

/* ---------- jam ---------- */
#clock{
  position:fixed;right:16px;top:14px;z-index:30;display:flex;gap:8px;align-items:center;
  font-family:var(--mono);font-size:13px;color:#E2E8F0;background:#0B0F17;
  border:1px solid #2A3346;padding:7px 12px;
}
#clock.over{color:#FCD34D}
#clock .dot{width:7px;height:7px;background:#22C55E}
#clock.paused .dot{background:#94A3B8}
#clock.over .dot{background:#FCD34D}

/* ---------- bantuan ---------- */
#help{
  position:fixed;left:16px;top:14px;z-index:30;
  font-family:var(--mono);font-size:12px;color:var(--micro);background:#0B0F17;
  border:1px solid #2A3346;padding:7px 12px;
}
#help b{color:#E2E8F0;font-weight:600}

@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;background:#fff}
  #stage{position:static;transform:none!important;width:1920px;height:auto;background:#fff}
  .slide{
    display:block!important;position:relative;width:1920px;height:1080px;
    page-break-after:always;break-after:page;
  }
  .slide:last-child{page-break-after:auto;break-after:auto}
  .slide .a{opacity:1!important;animation:none!important;transform:none!important}
  #clock,#help,#notes{display:none!important}
}
</style>
</head>
<body>
<div id="stage">
<!--__SLIDES__-->
</div>

<div id="clock" title="T timer · R reset · T jeda"><span class="dot"></span><span id="cl">00:00 / 09:00</span></div>
<div id="help"><b>→</b> lanjut &nbsp; <b>←</b> balik &nbsp; <b>N</b> catatan &nbsp; <b>T</b> timer &nbsp; <b>F</b> layar penuh</div>
<div id="notes"><div class="nh">Catatan pembicara</div><div id="notesBody"></div><div class="nt" id="notesHint"></div></div>

<script>
/*__APP__*/
</script>
</body>
</html>
